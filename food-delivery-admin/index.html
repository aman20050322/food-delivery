<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - Orders</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', sans-serif;
  background: #0a0a0a;
  color: #f3f4f6;
  padding: 40px;
}

.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  border-bottom: 2px solid #333;
  padding-bottom: 10px;
}

h1 {
  font-size: 32px;
  color: #fff;
}

.stats-card {
  background: linear-gradient(135deg, #f97316, #ea580c);
  padding: 15px 25px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(249, 115, 22, 0.25);
}

.stats-card .count {
  font-size: 28px;
  font-weight: 800;
  color: #fff;
}

.stats-card .label {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
  letter-spacing: 1px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #18181b;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

th, td {
  padding: 16px 20px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

th {
  background: #27272a;
  color: #a1a1aa;
  font-weight: 600;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

td {
  font-size: 15px;
}

.order-items {
  background: #09090b;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  color: #a1a1aa;
  margin-top: 5px;
}

.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 12px;
}
.badge.id { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
.badge.pending { background: rgba(249, 115, 22, 0.2); color: #f97316; }
.badge.completed { background: rgba(34, 197, 94, 0.2); color: #22c55e; }

.refresh-btn {
  background: #27272a;
  border: 1px solid #3f3f46;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 20px;
  transition: all 0.2s;
}
.refresh-btn:hover { background: #3f3f46; }

.complete-btn {
  background: #10b981;
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 6px;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-top: 8px;
}
.complete-btn:hover { opacity: 0.8; }

</style>
</head>
<body>

<div class="header-container">
  <h1>&#128203; Admin Dashboard - Recent Orders</h1>
  <div style="display: flex; gap: 20px;">
    <div class="stats-card">
      <div class="count" id="pending-count">0</div>
      <div class="label">Pending Orders</div>
    </div>
    <div class="stats-card" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);">
      <div class="count" id="today-revenue">Rs. 0</div>
      <div class="label">Today's Revenue</div>
    </div>
  </div>
</div>

<button class="refresh-btn" onclick="fetchOrders()">Refresh Orders</button>

<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Customer</th>
      <th>Delivery Details</th>
      <th>Items Ordered</th>
      <th>Total Price</th>
      <th>Status</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody id="orders-body">
    <tr>
      <td colspan="7" style="text-align: center; color: #a1a1aa;">Loading orders...</td>
    </tr>
  </tbody>
</table>

<h2 style="margin-top: 50px; margin-bottom: 20px; font-size: 24px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px;">&#128200; Sales Analytics</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
  <div>
    <h3 style="margin-bottom: 15px; color: #a1a1aa; font-size: 16px;">Daily Sales</h3>
    <table>
      <thead>
        <tr><th>Date</th><th>Orders</th><th>Revenue</th></tr>
      </thead>
      <tbody id="daily-sales-body">
        <tr><td colspan="3" style="text-align: center; color: #a1a1aa;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <div>
    <h3 style="margin-bottom: 15px; color: #a1a1aa; font-size: 16px;">Monthly Sales</h3>
    <table>
      <thead>
        <tr><th>Month</th><th>Orders</th><th>Revenue</th></tr>
      </thead>
      <tbody id="monthly-sales-body">
        <tr><td colspan="3" style="text-align: center; color: #a1a1aa;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// =========================================================================
// IMPORTANT: REPLACE THIS URL WITH YOUR DEPLOYED VERCEL CLIENT APP URL
// Example: const API_BASE_URL = 'https://food-delivery-client.vercel.app';
// =========================================================================
const API_BASE_URL = 'https://food-delivery-mu-blond.vercel.app';

function fetchOrders() {
  document.getElementById('orders-body').innerHTML = '<tr><td colspan="7" style="text-align: center; color: #a1a1aa;">Loading orders...</td></tr>';
  
  fetch(API_BASE_URL + '/api/orders')
    .then(res => res.json())
    .then(orders => {
      const tbody = document.getElementById('orders-body');
      tbody.innerHTML = '';
      
      let pendingCount = 0;
      
      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #a1a1aa;">No orders found in the database.</td></tr>';
        document.getElementById('pending-count').innerText = 0;
        return;
      }
      
      orders.forEach(order => {
        if (order.status === 'Pending') pendingCount++;
        
        const itemsHtml = order.cart_data.map(item => `
          <div>${item.quantity}x ${item.name} (Rs. ${item.price})</div>
        `).join('');
        
        const statusBadgeClass = order.status === 'Pending' ? 'pending' : 'completed';
        const actionHtml = order.status === 'Pending' 
          ? `<button class="complete-btn" onclick="markCompleted(${order.id})">Mark as Completed ✓</button>`
          : ``;
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="badge id">#${order.id}</span></td>
          <td><strong>${order.user_name}</strong><br><span style="color:#71717a; font-size:12px;">${order.phone}</span></td>
          <td>${order.address}<br>${order.city}, ${order.zip_code}</td>
          <td><div class="order-items">${itemsHtml}</div></td>
          <td style="font-weight:bold; color:#f97316;">Rs. ${order.total_price}</td>
          <td>
            <span class="badge ${statusBadgeClass}">${order.status}</span><br>
            ${actionHtml}
          </td>
          <td style="font-size:13px; color:#71717a;">${new Date(order.timestamp).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
      
      document.getElementById('pending-count').innerText = pendingCount;
    })
    .catch(err => {
      console.error(err);
      document.getElementById('orders-body').innerHTML = '<tr><td colspan="7" style="text-align: center; color: #ef4444;">Error loading orders. Ensure the server is running.</td></tr>';
    });
}

function markCompleted(orderId) {
  if (!API_BASE_URL) {
    alert("Please configure the API_BASE_URL in the code first!");
    return;
  }
  fetch(API_BASE_URL + '/api/order/status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: orderId, status: 'Completed' })
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === 'success') {
      fetchOrders(); // Refresh the list
      fetchSalesSummary(); // Refresh revenue
    } else {
      alert("Error updating order status.");
    }
  })
  .catch(err => console.error(err));
}

function fetchSalesSummary() {
  fetch(API_BASE_URL + '/api/sales/summary')
    .then(res => res.json())
    .then(data => {
      document.getElementById('today-revenue').innerText = 'Rs. ' + data.today_revenue;
      
      const dailyBody = document.getElementById('daily-sales-body');
      if (data.daily_sales.length === 0) {
        dailyBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #a1a1aa;">No daily sales data.</td></tr>';
      } else {
        dailyBody.innerHTML = data.daily_sales.map(s => {
          const breakdown = s.order_list.map(o => `<span class="badge id" style="white-space: nowrap;">#${o.id}: Rs. ${o.amount}</span>`).join('');
          return `
          <tr>
            <td style="vertical-align: top;">${s.date}</td>
            <td><div style="display: flex; flex-wrap: wrap; gap: 6px;">${breakdown}</div></td>
            <td style="font-weight:bold; color:#10b981; vertical-align: top;">Rs. ${s.revenue}</td>
          </tr>
          `;
        }).join('');
      }

      const monthlyBody = document.getElementById('monthly-sales-body');
      if (data.monthly_sales.length === 0) {
        monthlyBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #a1a1aa;">No monthly sales data.</td></tr>';
      } else {
        monthlyBody.innerHTML = data.monthly_sales.map(s => `
          <tr>
            <td>${s.month}</td>
            <td>${s.orders}</td>
            <td style="font-weight:bold; color:#10b981;">Rs. ${s.revenue}</td>
          </tr>
        `).join('');
      }
    })
    .catch(err => console.error('Error fetching sales summary:', err));
}

// Fetch on load
fetchOrders();
fetchSalesSummary();
</script>

</body>
</html>
